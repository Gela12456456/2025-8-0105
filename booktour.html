<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Tour | Gelacso Travel & Tours</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="booktour.css">
</head>

<body>

    <!-- SAME STRUCTURE AS INDEX -->
    <section class="section1">

        <header class="hero">

            <!-- LOGO AND NAVIGATION -->
            <nav>

                <div class="logo">

                    <img src="gelacso.png" alt="Gelacso Travel & Tours">

                    <h2>
                        GELACSO TRAVEL & TOURS
                    </h2>

                </div>

                <div class="nav-links">

                    <a href="index.html">
                        HOME
                    </a>

                    <a href="home.html">
                        TOURS
                    </a>

                    <a href="contact.html">
                        CONTACT US
                    </a>

                    <a href="admin.html">
                        ADMIN
                    </a>

                </div>

            </nav>

            <!-- BOOKING CONTENT -->
            <main>

                <section class="booking-page">

                    <div class="booking-container">

                        <h1>Book a Tour</h1>

                        <p class="booking-description">
                            Plan your next island adventure with us!
                        </p>

                        <form class="booking-form" id="bookingForm">

                            <label for="customerName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="customerName"
                                name="customerName"
                                placeholder="Enter your full name"
                                required
                            >

                            <label for="customerEmail">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="customerEmail"
                                name="customerEmail"
                                placeholder="Enter your email"
                                required
                            >

                            <label for="tour">
                                Select Tour Package
                            </label>

                            <select id="tour" name="tour" required>
                                <option value="A">Tour A - Island Hopping</option>
                                <option value="B">Tour B - Island Hopping</option>
                                <option value="C">Tour C - Island Hopping</option>
                                <option value="D">Tour D - Island Hopping</option>
                            </select>

                            <label for="people">
                                Number of People
                            </label>

                            <input
                                type="number"
                                id="people"
                                name="people"
                                min="1"
                                max="100"
                                value="1"
                                required
                            >

                            <label for="tourDate">
                                Preferred Tour Date
                            </label>

                            <input
                                type="date"
                                id="tourDate"
                                name="tourDate"
                                required
                            >

                            <div class="booking-total">

                                <p>Price per person: ₱1,500</p>

                                <p>Estimated Total</p>

                                <strong id="totalPrice">
                                    ₱1,500
                                </strong>

                            </div>

                            <button
                                type="submit"
                                class="booking-submit"
                            >
                                Submit Booking Request
                            </button>

                            <a href="home.html" class="booking-back">
                                ← Back to Available Tours
                            </a>

                        </form>

                    </div>

                </section>

            </main>

        </header>

    </section>
</body>

</html>
